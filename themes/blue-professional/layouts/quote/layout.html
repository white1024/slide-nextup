<section class="slide" data-layout="quote">
  <p data-el="kicker" data-slot="kicker" data-role="eyebrow">{{kicker}}</p>
  <p data-el="meta" data-slot="meta" data-role="chip">{{meta}}</p>
  <div data-el="ring" data-role="ring"></div>
  <div data-el="orb" data-role="orb"></div>
  <svg data-el="mark" data-role="quote-mark" data-shape="quote" viewBox="0 0 25 20" preserveAspectRatio="none" aria-hidden="true"><path d="M3 3h8v7c0 4.4-2.6 7.2-7 8v-3.2c2-.5 3.1-1.8 3.3-3.8H3V3zm11 0h8v7c0 4.4-2.6 7.2-7 8v-3.2c2-.5 3.1-1.8 3.3-3.8H14V3z"/></svg>
  <h1 data-el="title" data-slot="title" data-role="quote" data-fit="true">{{title}}</h1>
  <p data-el="caption" data-slot="caption" data-role="caption">{{caption}}</p>
  <div data-el="progress" data-role="progress"></div>
  <p data-el="page" data-slot="page" data-role="meta">{{page}}</p>
</section>
