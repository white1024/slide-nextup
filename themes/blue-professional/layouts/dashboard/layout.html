<section class="slide" data-layout="dashboard">
  <p data-el="kicker" data-slot="kicker" data-role="eyebrow">{{kicker}}</p>
  <p data-el="meta" data-slot="meta" data-role="chip">{{meta}}</p>
  <h1 data-el="title" data-slot="title" data-role="title">{{title}}</h1>
  <div data-el="stat-1" data-slot="stat-1" data-role="stat">{{stat-1}}</div>
  <div data-el="stat-2" data-slot="stat-2" data-role="stat">{{stat-2}}</div>
  <div data-el="stat-3" data-slot="stat-3" data-role="stat">{{stat-3}}</div>
  <div data-el="stat-4" data-slot="stat-4" data-role="stat">{{stat-4}}</div>
  <div data-el="stat-5" data-slot="stat-5" data-role="stat">{{stat-5}}</div>
  <div data-el="stat-6" data-slot="stat-6" data-role="stat">{{stat-6}}</div>
  <div data-el="progress" data-role="progress"></div>
  <p data-el="page" data-slot="page" data-role="meta">{{page}}</p>
</section>
