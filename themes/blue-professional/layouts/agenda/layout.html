<section class="slide" data-layout="agenda">
  <p data-el="kicker" data-slot="kicker" data-role="eyebrow">{{kicker}}</p>
  <p data-el="meta" data-slot="meta" data-role="chip">{{meta}}</p>
  <h1 data-el="title" data-slot="title" data-role="title">{{title}}</h1>
  <div data-el="accent" data-role="backdrop"></div>
  <div data-el="item-1" data-slot="item-1" data-role="entry">{{item-1}}</div>
  <div data-el="item-2" data-slot="item-2" data-role="entry">{{item-2}}</div>
  <div data-el="item-3" data-slot="item-3" data-role="entry">{{item-3}}</div>
  <div data-el="item-4" data-slot="item-4" data-role="entry">{{item-4}}</div>
  <div data-el="item-5" data-slot="item-5" data-role="entry">{{item-5}}</div>
  <div data-el="item-6" data-slot="item-6" data-role="entry">{{item-6}}</div>
  <div data-el="progress" data-role="progress"></div>
  <p data-el="page" data-slot="page" data-role="meta">{{page}}</p>
</section>
