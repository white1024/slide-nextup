<section class="slide" data-layout="process">
  <p data-el="kicker" data-slot="kicker" data-role="eyebrow">{{kicker}}</p>
  <p data-el="meta" data-slot="meta" data-role="chip">{{meta}}</p>
  <h1 data-el="title" data-slot="title" data-role="title">{{title}}</h1>
  <p data-el="subtitle" data-slot="subtitle" data-role="subtitle" data-fit="true">{{subtitle}}</p>
  <div data-el="step-1" data-slot="step-1" data-role="step" data-tone="s1">{{step-1}}</div>
  <div data-el="step-2" data-slot="step-2" data-role="step" data-tone="s2">{{step-2}}</div>
  <div data-el="step-3" data-slot="step-3" data-role="step" data-tone="s3">{{step-3}}</div>
  <div data-el="step-4" data-slot="step-4" data-role="step" data-tone="s4">{{step-4}}</div>
  <div data-el="step-5" data-slot="step-5" data-role="step" data-tone="s5">{{step-5}}</div>
  <div data-el="step-6" data-slot="step-6" data-role="step" data-tone="s6">{{step-6}}</div>
  <p data-el="caption" data-slot="caption" data-role="caption" data-fit="true">{{caption}}</p>
  <div data-el="progress" data-role="progress"></div>
  <p data-el="page" data-slot="page" data-role="meta">{{page}}</p>
</section>
