<section class="slide" data-layout="section">
  <p data-el="brand" data-slot="brand" data-role="eyebrow">{{brand}}</p>
  <p data-el="meta" data-slot="meta" data-role="chip">{{meta}}</p>
  <p data-el="number" data-slot="number" data-role="number">{{number}}</p>
  <div data-el="accent" data-role="backdrop"></div>
  <h1 data-el="title" data-slot="title" data-role="title">{{title}}</h1>
  <p data-el="body" data-slot="body" data-role="body" data-fit="true">{{body}}</p>
  <div data-el="progress" data-role="progress"></div>
  <p data-el="page" data-slot="page" data-role="meta">{{page}}</p>
</section>
