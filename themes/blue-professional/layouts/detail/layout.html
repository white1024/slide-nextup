<section class="slide" data-layout="detail">
  <p data-el="kicker" data-slot="kicker" data-role="eyebrow">{{kicker}}</p>
  <p data-el="meta" data-slot="meta" data-role="chip">{{meta}}</p>
  <h1 data-el="title" data-slot="title" data-role="title">{{title}}</h1>
  <div data-el="block-1" data-role="card"></div>
  <p data-el="head-1" data-slot="head-1" data-role="label">{{head-1}}</p>
  <div data-el="list-1" data-slot="list-1" data-role="list">{{list-1}}</div>
  <div data-el="block-2" data-role="card"></div>
  <p data-el="head-2" data-slot="head-2" data-role="label">{{head-2}}</p>
  <div data-el="list-2" data-slot="list-2" data-role="list">{{list-2}}</div>
  <div data-el="block-3" data-role="card"></div>
  <p data-el="head-3" data-slot="head-3" data-role="label">{{head-3}}</p>
  <div data-el="list-3" data-slot="list-3" data-role="list">{{list-3}}</div>
  <div data-el="block-4" data-role="card"></div>
  <p data-el="head-4" data-slot="head-4" data-role="label">{{head-4}}</p>
  <div data-el="list-4" data-slot="list-4" data-role="list">{{list-4}}</div>
  <div data-el="progress" data-role="progress"></div>
  <p data-el="page" data-slot="page" data-role="meta">{{page}}</p>
</section>
