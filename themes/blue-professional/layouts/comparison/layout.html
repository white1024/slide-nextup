<section class="slide" data-layout="comparison">
  <p data-el="kicker" data-slot="kicker" data-role="eyebrow">{{kicker}}</p>
  <p data-el="meta" data-slot="meta" data-role="chip">{{meta}}</p>
  <h1 data-el="title" data-slot="title" data-role="title">{{title}}</h1>
  <div data-el="left" data-role="card"></div>
  <p data-el="left-title" data-slot="left-title" data-role="label">{{left-title}}</p>
  <div data-el="left-items" data-slot="left-items" data-role="list">{{left-items}}</div>
  <div data-el="right" data-role="card" data-tone="accent"></div>
  <p data-el="right-title" data-slot="right-title" data-role="label">{{right-title}}</p>
  <div data-el="right-items" data-slot="right-items" data-role="list">{{right-items}}</div>
  <div data-el="progress" data-role="progress"></div>
  <p data-el="page" data-slot="page" data-role="meta">{{page}}</p>
</section>
