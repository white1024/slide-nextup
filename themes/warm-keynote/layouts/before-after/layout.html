<section class="slide" data-layout="before-after">
  <p data-el="kicker" data-slot="kicker" data-role="chapter">{{kicker}}</p>
  <p data-el="meta" data-slot="meta" data-role="chip">{{meta}}</p>
  <h1 data-el="title" data-slot="title" data-role="heading">{{title}}</h1>
  <div data-el="before-box" data-role="sunk"></div>
  <p data-el="before-label" data-slot="before-label" data-role="eyebrow">{{before-label}}</p>
  <div data-el="before" data-slot="before" data-role="flow">{{before}}</div>
  <div data-el="after-box" data-role="card"></div>
  <p data-el="after-label" data-slot="after-label" data-role="eyebrow-accent">{{after-label}}</p>
  <div data-el="after" data-slot="after" data-role="flow-accent">{{after}}</div>
  <p data-el="caption" data-slot="caption" data-role="caption" data-fit="true">{{caption}}</p>
  <div data-el="progress" data-role="progress"></div>
  <p data-el="page" data-slot="page" data-role="chip">{{page}}</p>
</section>
