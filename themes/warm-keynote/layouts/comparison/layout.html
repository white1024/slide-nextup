<section class="slide" data-layout="comparison">
  <p data-el="kicker" data-slot="kicker" data-role="chapter">{{kicker}}</p>
  <p data-el="meta" data-slot="meta" data-role="chip">{{meta}}</p>
  <h1 data-el="title" data-slot="title" data-role="heading">{{title}}</h1>
  <div data-el="left" data-role="card"></div>
  <p data-el="left-title" data-slot="left-title" data-role="label">{{left-title}}</p>
  <div data-el="left-items" data-slot="left-items" data-role="list">{{left-items}}</div>
  <div data-el="link" data-role="divider"></div>
  <div data-el="badge" data-role="badge"></div>
  <svg data-el="badge-arrow" data-role="connector" data-shape="arrow" viewBox="0 0 41 24" preserveAspectRatio="none" aria-hidden="true"><line x1="2" y1="12" x2="30" y2="12"></line><polygon points="28,4 40,12 28,20"></polygon></svg>
  <div data-el="right" data-role="alert"></div>
  <p data-el="right-title" data-slot="right-title" data-role="label-alert">{{right-title}}</p>
  <div data-el="right-items" data-slot="right-items" data-role="list-alert">{{right-items}}</div>
  <div data-el="progress" data-role="progress"></div>
  <p data-el="page" data-slot="page" data-role="chip">{{page}}</p>
</section>
