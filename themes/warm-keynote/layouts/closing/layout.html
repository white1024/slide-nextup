<section class="slide" data-layout="closing">
  <div data-el="bar" data-role="backdrop"></div>
  <h1 data-el="title" data-slot="title" data-role="title">{{title}}</h1>
  <p data-el="body" data-slot="body" data-role="body" data-fit="true">{{body}}</p>
  <p data-el="caption" data-slot="caption" data-role="caption">{{caption}}</p>
  <p data-el="cta" data-slot="cta" data-role="cta" data-fit="true">{{cta}}</p>
  <div data-el="evidence" data-slot="evidence" data-role="flow">{{evidence}}</div>
  <div data-el="progress" data-role="progress"></div>
  <p data-el="page" data-slot="page" data-role="chip">{{page}}</p>
</section>
