<section class="slide" data-layout="fact">
  <p data-el="kicker" data-slot="kicker" data-role="chapter">{{kicker}}</p>
  <p data-el="meta" data-slot="meta" data-role="chip">{{meta}}</p>
  <div data-el="fact" data-slot="fact" data-role="stat">{{fact}}</div>
  <p data-el="caption" data-slot="caption" data-role="caption" data-fit="true">{{caption}}</p>
  <div data-el="progress" data-role="progress"></div>
  <p data-el="page" data-slot="page" data-role="chip">{{page}}</p>
</section>
