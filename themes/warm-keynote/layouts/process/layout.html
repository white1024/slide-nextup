<section class="slide" data-layout="process">
  <p data-el="kicker" data-slot="kicker" data-role="chapter">{{kicker}}</p>
  <p data-el="meta" data-slot="meta" data-role="chip">{{meta}}</p>
  <h1 data-el="title" data-slot="title" data-role="heading">{{title}}</h1>
  <p data-el="subtitle" data-slot="subtitle" data-role="body" data-fit="true">{{subtitle}}</p>
  <div data-el="step-1" data-slot="step-1" data-role="pill">{{step-1}}</div>
  <svg data-el="arrow-1" data-role="connector" data-shape="arrow" viewBox="0 0 41 24" preserveAspectRatio="none" aria-hidden="true"><line x1="2" y1="12" x2="30" y2="12"></line><polygon points="28,4 40,12 28,20"></polygon></svg>
  <div data-el="step-2" data-slot="step-2" data-role="pill">{{step-2}}</div>
  <svg data-el="arrow-2" data-role="connector" data-shape="arrow" viewBox="0 0 41 24" preserveAspectRatio="none" aria-hidden="true"><line x1="2" y1="12" x2="30" y2="12"></line><polygon points="28,4 40,12 28,20"></polygon></svg>
  <div data-el="step-3" data-slot="step-3" data-role="pill">{{step-3}}</div>
  <svg data-el="arrow-3" data-role="connector" data-shape="arrow" viewBox="0 0 41 24" preserveAspectRatio="none" aria-hidden="true"><line x1="2" y1="12" x2="30" y2="12"></line><polygon points="28,4 40,12 28,20"></polygon></svg>
  <div data-el="step-4" data-slot="step-4" data-role="pill">{{step-4}}</div>
  <svg data-el="arrow-4" data-role="connector" data-shape="arrow" viewBox="0 0 41 24" preserveAspectRatio="none" aria-hidden="true"><line x1="2" y1="12" x2="30" y2="12"></line><polygon points="28,4 40,12 28,20"></polygon></svg>
  <div data-el="step-5" data-slot="step-5" data-role="pill">{{step-5}}</div>
  <svg data-el="arrow-5" data-role="connector" data-shape="arrow" viewBox="0 0 41 24" preserveAspectRatio="none" aria-hidden="true"><line x1="2" y1="12" x2="30" y2="12"></line><polygon points="28,4 40,12 28,20"></polygon></svg>
  <div data-el="step-6" data-slot="step-6" data-role="pill">{{step-6}}</div>
  <p data-el="caption" data-slot="caption" data-role="caption" data-fit="true">{{caption}}</p>
  <div data-el="progress" data-role="progress"></div>
  <p data-el="page" data-slot="page" data-role="chip">{{page}}</p>
</section>
