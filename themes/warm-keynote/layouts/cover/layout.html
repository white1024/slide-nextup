<section class="slide" data-layout="cover">
  <div data-el="bar" data-role="backdrop"></div>
  <p data-el="brand" data-slot="brand" data-role="kicker">{{brand}}</p>
  <h1 data-el="title" data-slot="title" data-role="title" data-fit="true">{{title}}</h1>
  <p data-el="subtitle" data-slot="subtitle" data-role="subtitle" data-fit="true">{{subtitle}}</p>
  <div data-el="progress" data-role="progress"></div>
  <p data-el="page" data-slot="page" data-role="chip">{{page}}</p>
</section>
