<section class="slide" data-layout="cover">
  <div data-el="rule-top" data-role="divider"></div>
  <div data-el="rule-bottom" data-role="divider"></div>
  <svg data-el="pixel" data-role="pixel" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <pattern id="cg-scan" width="2.4" height="100" patternUnits="userSpaceOnUse">
        <line x1="0.5" y1="0" x2="0.5" y2="100"></line>
      </pattern>
    </defs>
    <rect x="36" y="0" width="38" height="14" fill="url(#cg-scan)"></rect>
    <rect x="22" y="14" width="50" height="12" fill="url(#cg-scan)"></rect>
    <rect x="34" y="26" width="46" height="11" fill="url(#cg-scan)"></rect>
    <rect x="16" y="37" width="60" height="13" fill="url(#cg-scan)"></rect>
    <rect x="28" y="50" width="48" height="11" fill="url(#cg-scan)"></rect>
    <rect x="18" y="61" width="62" height="14" fill="url(#cg-scan)"></rect>
    <rect x="34" y="75" width="44" height="12" fill="url(#cg-scan)"></rect>
    <rect x="22" y="87" width="50" height="13" fill="url(#cg-scan)"></rect>
  </svg>
  <h1 data-el="title" data-slot="title" data-role="title">{{title}}</h1>
  <p data-el="brand" data-slot="brand" data-role="kicker">{{brand}}</p>
  <p data-el="subtitle" data-slot="subtitle" data-role="subtitle" data-fit="true">{{subtitle}}</p>
  <p data-el="meta" data-slot="meta" data-role="meta">{{meta}}</p>
  <p data-el="cta" data-slot="cta" data-role="caption" data-fit="true">{{cta}}</p>
  <p data-el="page" data-slot="page" data-role="meta">{{page}}</p>
</section>
