<section class="slide" data-layout="cover">
  <div data-el="dot" data-role="badge"></div>
  <p data-el="kicker" data-slot="kicker" data-role="eyebrow">{{kicker}}</p>
  <h1 data-el="title" data-slot="title" data-role="heading">{{title}}</h1>
  <p data-el="subtitle" data-slot="subtitle" data-role="subtitle" data-fit="true">{{subtitle}}</p>
  <div data-el="rule" data-role="divider"></div>
  <p data-el="grid-label-1" data-slot="grid-label-1" data-role="meta">{{grid-label-1}}</p>
  <p data-el="grid-value-1" data-slot="grid-value-1" data-role="meta" data-fit="true">{{grid-value-1}}</p>
  <div data-el="sep-1" data-role="divider"></div>
  <p data-el="grid-label-2" data-slot="grid-label-2" data-role="meta">{{grid-label-2}}</p>
  <p data-el="grid-value-2" data-slot="grid-value-2" data-role="meta" data-fit="true">{{grid-value-2}}</p>
  <div data-el="sep-2" data-role="divider"></div>
  <p data-el="grid-label-3" data-slot="grid-label-3" data-role="meta">{{grid-label-3}}</p>
  <p data-el="grid-value-3" data-slot="grid-value-3" data-role="meta" data-fit="true">{{grid-value-3}}</p>
  <div data-el="sep-3" data-role="divider"></div>
  <p data-el="grid-label-4" data-slot="grid-label-4" data-role="meta">{{grid-label-4}}</p>
  <p data-el="grid-value-4" data-slot="grid-value-4" data-role="meta" data-fit="true">{{grid-value-4}}</p>
  <div data-el="sep-4" data-role="divider"></div>
  <p data-el="grid-label-5" data-slot="grid-label-5" data-role="meta">{{grid-label-5}}</p>
  <p data-el="grid-value-5" data-slot="grid-value-5" data-role="meta" data-fit="true">{{grid-value-5}}</p>
  <p data-el="caveat" data-slot="caveat" data-role="alert" data-fit="true">{{caveat}}</p>
  <p data-el="meta" data-slot="meta" data-role="meta">{{meta}}</p>
  <div data-el="progress" data-role="progress"></div>
  <p data-el="page" data-slot="page" data-role="meta">{{page}}</p>
</section>
