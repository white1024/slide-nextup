<section class="slide" data-layout="data-table">
  <p data-el="kicker" data-slot="kicker" data-role="eyebrow">{{kicker}}</p>
  <div data-el="headrule" data-role="divider"></div>
  <h1 data-el="title" data-slot="title" data-role="heading">{{title}}</h1>
  <p data-el="subtitle" data-slot="subtitle" data-role="body" data-fit="true">{{subtitle}}</p>
  <div data-el="table" data-slot="table" data-role="table">{{table}}</div>
  <p data-el="caption" data-slot="caption" data-role="caption" data-fit="true">{{caption}}</p>
  <div data-el="footrule" data-role="divider"></div>
  <p data-el="meta" data-slot="meta" data-role="meta">{{meta}}</p>
  <div data-el="progress" data-role="progress"></div>
  <p data-el="page" data-slot="page" data-role="meta">{{page}}</p>
</section>
