<section class="slide" data-layout="cards-list">
  <p data-el="kicker" data-slot="kicker" data-role="eyebrow">{{kicker}}</p>
  <div data-el="headrule" data-role="divider"></div>
  <h1 data-el="title" data-slot="title" data-role="heading">{{title}}</h1>
  <p data-el="subtitle" data-slot="subtitle" data-role="body" data-fit="true">{{subtitle}}</p>
  <div data-el="card-1" data-role="card"></div>
  <p data-el="card-1-label" data-slot="card-1-label" data-role="eyebrow-accent">{{card-1-label}}</p>
  <p data-el="card-1-title" data-slot="card-1-title" data-role="label">{{card-1-title}}</p>
  <div data-el="card-1-items" data-slot="card-1-items" data-role="list">{{card-1-items}}</div>
  <div data-el="card-2" data-role="card"></div>
  <p data-el="card-2-label" data-slot="card-2-label" data-role="eyebrow-accent" data-tone="second">{{card-2-label}}</p>
  <p data-el="card-2-title" data-slot="card-2-title" data-role="label">{{card-2-title}}</p>
  <div data-el="card-2-items" data-slot="card-2-items" data-role="list">{{card-2-items}}</div>
  <div data-el="card-3" data-role="card"></div>
  <p data-el="card-3-label" data-slot="card-3-label" data-role="eyebrow-accent" data-tone="third">{{card-3-label}}</p>
  <p data-el="card-3-title" data-slot="card-3-title" data-role="label">{{card-3-title}}</p>
  <div data-el="card-3-items" data-slot="card-3-items" data-role="list">{{card-3-items}}</div>
  <div data-el="footrule" data-role="divider"></div>
  <p data-el="meta" data-slot="meta" data-role="meta">{{meta}}</p>
  <div data-el="progress" data-role="progress"></div>
  <p data-el="page" data-slot="page" data-role="meta">{{page}}</p>
</section>
