<section class="slide" data-layout="flow-3">
  <p data-el="kicker" data-slot="kicker" data-role="eyebrow">{{kicker}}</p>
  <div data-el="headrule" data-role="divider"></div>
  <h1 data-el="title" data-slot="title" data-role="heading">{{title}}</h1>
  <p data-el="subtitle" data-slot="subtitle" data-role="body" data-fit="true">{{subtitle}}</p>
  <div data-el="node-1" data-slot="node-1" data-role="node">{{node-1}}</div>
  <svg data-el="arrow-1" data-role="connector" data-shape="arrow" viewBox="0 0 41 24" preserveAspectRatio="none" aria-hidden="true"><line x1="2" y1="12" x2="30" y2="12"></line><polygon points="28,4 40,12 28,20"></polygon></svg>
  <div data-el="node-2" data-slot="node-2" data-role="node">{{node-2}}</div>
  <svg data-el="arrow-2" data-role="connector" data-shape="arrow" viewBox="0 0 41 24" preserveAspectRatio="none" aria-hidden="true"><line x1="2" y1="12" x2="30" y2="12"></line><polygon points="28,4 40,12 28,20"></polygon></svg>
  <div data-el="node-3" data-slot="node-3" data-role="node">{{node-3}}</div>
  <p data-el="caveat" data-slot="caveat" data-role="alert" data-fit="true">{{caveat}}</p>
  <div data-el="footrule" data-role="divider"></div>
  <p data-el="meta" data-slot="meta" data-role="meta">{{meta}}</p>
  <div data-el="progress" data-role="progress"></div>
  <p data-el="page" data-slot="page" data-role="meta">{{page}}</p>
</section>
