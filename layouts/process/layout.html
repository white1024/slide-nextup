<section class="slide" data-layout="process">
  <p data-el="brand" data-slot="brand" data-role="meta">{{brand}}</p>
  <p data-el="meta" data-slot="meta" data-role="meta">{{meta}}</p>
  <h1 data-el="title" data-slot="title" data-role="title">{{title}}</h1>
  <div data-el="rail" data-role="connector"></div>
  <div data-el="node-1" data-role="node"></div>
  <div data-el="node-2" data-role="node"></div>
  <div data-el="node-3" data-role="node"></div>
  <div data-el="node-4" data-role="node"></div>
  <div data-el="step-1" data-slot="step-1" data-role="card">{{step-1}}</div>
  <div data-el="step-2" data-slot="step-2" data-role="card">{{step-2}}</div>
  <div data-el="step-3" data-slot="step-3" data-role="card">{{step-3}}</div>
  <div data-el="step-4" data-slot="step-4" data-role="card">{{step-4}}</div>
  <p data-el="page" data-slot="page" data-role="meta">{{page}}</p>
</section>
