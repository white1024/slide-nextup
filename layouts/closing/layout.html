<section class="slide" data-layout="closing" data-tone="inverse">
  <div data-el="backdrop" data-role="backdrop"></div>
  <h1 data-el="title" data-slot="title" data-role="title">{{title}}</h1>
  <p data-el="body" data-slot="body" data-role="body">{{body}}</p>
  <p data-el="cta" data-slot="cta" data-role="cta">{{cta}}</p>
</section>
