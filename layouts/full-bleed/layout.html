<section class="slide" data-layout="full-bleed">
  <div data-el="photo" data-slot="photo" data-role="photo">{{photo}}</div>
  <div data-el="scrim" data-role="scrim"></div>
  <h1 data-el="title" data-slot="title" data-role="title">{{title}}</h1>
  <p data-el="caption" data-slot="caption" data-role="caption" data-fit="true">{{caption}}</p>
  <p data-el="page" data-slot="page" data-role="meta">{{page}}</p>
</section>
