<section class="slide" data-layout="chart-aside">
  <p data-el="brand" data-slot="brand" data-role="meta">{{brand}}</p>
  <p data-el="meta" data-slot="meta" data-role="meta">{{meta}}</p>
  <h1 data-el="title" data-slot="title" data-role="title">{{title}}</h1>
  <div data-el="chart" data-slot="chart" data-role="chart">{{chart}}</div>
  <div data-el="aside" data-slot="aside" data-role="card">{{aside}}</div>
  <p data-el="caption" data-slot="caption" data-role="caption">{{caption}}</p>
  <p data-el="page" data-slot="page" data-role="meta">{{page}}</p>
</section>
