<section class="slide" data-layout="hero">
  <div data-el="glow" data-role="glow"></div>
  <div data-el="corner-tl" data-role="corner"></div>
  <div data-el="corner-br" data-role="corner-end"></div>
  <p data-el="brand" data-slot="brand" data-role="meta">{{brand}}</p>
  <p data-el="meta" data-slot="meta" data-role="meta">{{meta}}</p>
  <div data-el="anchor" data-role="backdrop"></div>
  <p data-el="kicker" data-slot="kicker" data-role="kicker">{{kicker}}</p>
  <h1 data-el="title" data-slot="title" data-role="title">{{title}}</h1>
  <p data-el="subtitle" data-slot="subtitle" data-role="subtitle" data-fit="true">{{subtitle}}</p>
  <div data-el="stat-1" data-slot="stat-1" data-role="stat">{{stat-1}}</div>
  <div data-el="stat-2" data-slot="stat-2" data-role="stat">{{stat-2}}</div>
  <div data-el="stat-3" data-slot="stat-3" data-role="stat">{{stat-3}}</div>
  <p data-el="page" data-slot="page" data-role="meta">{{page}}</p>
</section>
