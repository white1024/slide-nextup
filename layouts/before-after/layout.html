<section class="slide" data-layout="before-after">
  <p data-el="brand" data-slot="brand" data-role="meta">{{brand}}</p>
  <p data-el="meta" data-slot="meta" data-role="meta">{{meta}}</p>
  <h1 data-el="title" data-slot="title" data-role="title">{{title}}</h1>
  <p data-el="before-label" data-slot="before-label" data-role="kicker">{{before-label}}</p>
  <p data-el="after-label" data-slot="after-label" data-role="kicker">{{after-label}}</p>
  <div data-el="before" data-slot="before" data-role="card">{{before}}</div>
  <svg data-el="arrow" data-role="connector" data-shape="arrow" viewBox="0 0 200 60" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><line x1="6" y1="30" x2="158" y2="30"/><polygon points="154,8 196,30 154,52"/></svg>
  <div data-el="after" data-slot="after" data-role="card">{{after}}</div>
  <p data-el="page" data-slot="page" data-role="meta">{{page}}</p>
</section>
