<section class="slide" data-layout="grid-2x2">
  <p data-el="brand" data-slot="brand" data-role="meta">{{brand}}</p>
  <p data-el="meta" data-slot="meta" data-role="meta">{{meta}}</p>
  <h1 data-el="title" data-slot="title" data-role="title">{{title}}</h1>
  <div data-el="card-1" data-slot="card-1" data-role="card">{{card-1}}</div>
  <div data-el="card-2" data-slot="card-2" data-role="card">{{card-2}}</div>
  <div data-el="card-3" data-slot="card-3" data-role="card">{{card-3}}</div>
  <div data-el="card-4" data-slot="card-4" data-role="card">{{card-4}}</div>
  <p data-el="page" data-slot="page" data-role="meta">{{page}}</p>
</section>
