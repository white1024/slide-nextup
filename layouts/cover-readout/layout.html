<section class="slide" data-layout="cover-readout">
  <p data-el="kicker" data-slot="kicker" data-role="kicker">{{kicker}}</p>
  <div data-el="rule" data-role="backdrop"></div>
  <h1 data-el="title" data-slot="title" data-role="title">{{title}}</h1>
  <div data-el="frame" data-role="card"></div>
  <p data-el="subtitle" data-slot="subtitle" data-role="subtitle">{{subtitle}}</p>
  <div data-el="ruler" data-role="divider"></div>
</section>
