<section class="slide" data-layout="bento-big2">
  <p data-el="brand" data-slot="brand" data-role="meta">{{brand}}</p>
  <p data-el="meta" data-slot="meta" data-role="meta">{{meta}}</p>
  <h1 data-el="title" data-slot="title" data-role="title">{{title}}</h1>
  <div data-el="main" data-slot="main" data-role="card">{{main}}</div>
  <div data-el="side-1" data-slot="side-1" data-role="card">{{side-1}}</div>
  <div data-el="side-2" data-slot="side-2" data-role="card">{{side-2}}</div>
  <p data-el="page" data-slot="page" data-role="meta">{{page}}</p>
</section>
