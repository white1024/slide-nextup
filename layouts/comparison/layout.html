<section class="slide" data-layout="comparison">
  <h1 data-el="title" data-slot="title" data-role="title">{{title}}</h1>
  <div data-el="divider" data-role="divider"></div>
  <h2 data-el="left-title" data-slot="left-title" data-role="subtitle">{{left-title}}</h2>
  <div data-el="left-items" data-slot="left-items" data-role="list">{{left-items}}</div>
  <h2 data-el="right-title" data-slot="right-title" data-role="subtitle">{{right-title}}</h2>
  <div data-el="right-items" data-slot="right-items" data-role="list">{{right-items}}</div>
</section>
